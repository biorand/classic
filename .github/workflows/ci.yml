name: CI
on: [push, pull_request]
jobs:
  build:
    name: Build biorand
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore
      run: dotnet restore
    - name: Build
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
        if not defined VSINSTALL exit /b 1
        call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
        msbuild biorandmod\biorandmod.vcxproj /p:Configuration=Release /p:Platform=Win32
        msbuild biorand.sln /t:build /p:Configuration=Release
    - name: Publish
      working-directory: biorand
      shell: cmd
      run: |
        dotnet publish -c Release --no-build
        cd bin\Release\net472\publish
        copy ${{ github.workspace }}\README.md .
        copy ${{ github.workspace }}\CHANGELOG.md .
        copy ${{ github.workspace }}\CONTRIBUTORS.md .
        copy ${{ github.workspace }}\LICENSE .
        md ${{ github.workspace }}\artefacts
        del *.pdb
        7z -r a ${{ github.workspace }}\artefacts\biorand.zip *
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: biorand
        compression-level: 0
        path: artefacts/biorand.zip

  cli-windows:
    name: Build biorand-cli (Windows x64)
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Build biorand module
      run: msbuild biorandmod\biorandmod.vcxproj /p:Configuration=Release /p:Platform=Win32
    - name: Test CLI
      run: dotnet test biorand-cli.Tests\biorand-cli.Tests.csproj -c Release
    - name: Publish CLI
      run: dotnet publish biorand-cli\biorand-cli.csproj -c Release -r win-x64 -o artefacts\win-x64
    - name: Smoke test
      run: artefacts\win-x64\biorand-cli.exe --version
    - name: Package
      shell: pwsh
      run: |
        Remove-Item artefacts/win-x64/data -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item artefacts/win-x64/Resources -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem artefacts/win-x64 -File | Where-Object { $_.Extension -in '.pdb', '.dbg' } | Remove-Item -Force
        Copy-Item README.md artefacts/win-x64/
        Copy-Item LICENSE artefacts/win-x64/
        Compress-Archive -Path artefacts/win-x64/* -DestinationPath artefacts/biorand-cli-win-x64.zip
    - name: Upload CLI
      uses: actions/upload-artifact@v4
      with:
        name: biorand-cli-windows
        compression-level: 0
        path: artefacts/biorand-cli-win-x64.zip
    - name: Upload biorand module
      uses: actions/upload-artifact@v4
      with:
        name: biorand-module
        compression-level: 0
        path: biorandmod/bin/biorand.dll
        if-no-files-found: error

  cli-linux:
    name: Build biorand-cli (Linux x64)
    runs-on: ubuntu-22.04
    needs: cli-windows
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install NativeAOT prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev
    - name: Download biorand module
      uses: actions/download-artifact@v4
      with:
        name: biorand-module
        path: biorandmod/bin
    - name: Test CLI
      run: dotnet test biorand-cli.Tests/biorand-cli.Tests.csproj -c Release
    - name: Publish CLI
      run: dotnet publish biorand-cli/biorand-cli.csproj -c Release -r linux-x64 -o artefacts/linux-x64
    - name: Smoke test
      run: artefacts/linux-x64/biorand-cli --version
    - name: Package
      run: |
        rm -rf artefacts/linux-x64/data artefacts/linux-x64/Resources
        find artefacts/linux-x64 -maxdepth 1 -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
        cp README.md LICENSE artefacts/linux-x64/
        tar -czf artefacts/biorand-cli-linux-x64.tar.gz -C artefacts/linux-x64 .
    - name: Upload CLI
      uses: actions/upload-artifact@v4
      with:
        name: biorand-cli-linux
        compression-level: 0
        path: artefacts/biorand-cli-linux-x64.tar.gz

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli-windows, cli-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download GUI
      uses: actions/download-artifact@v4
      with:
        name: biorand
        path: artefacts
    - name: Download CLI (Windows)
      uses: actions/download-artifact@v4
      with:
        name: biorand-cli-windows
        path: artefacts
    - name: Download CLI (Linux)
      uses: actions/download-artifact@v4
      with:
        name: biorand-cli-linux
        path: artefacts
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          artefacts/biorand.zip
          artefacts/biorand-cli-win-x64.zip
          artefacts/biorand-cli-linux-x64.tar.gz

  nightly:
    name: Publish nightly
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, cli-windows, cli-linux]
    runs-on: ubuntu-latest
    # One shared release: queue publishes so an older build can't finish last and overwrite a newer one.
    concurrency:
      group: nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download GUI
      uses: actions/download-artifact@v4
      with:
        name: biorand
        path: artefacts
    - name: Download CLI (Windows)
      uses: actions/download-artifact@v4
      with:
        name: biorand-cli-windows
        path: artefacts
    - name: Download CLI (Linux)
      uses: actions/download-artifact@v4
      with:
        name: biorand-cli-linux
        path: artefacts
    - name: Point nightly tag at this commit
      run: |
        git tag -f nightly
        git push --force origin refs/tags/nightly
    - name: Publish nightly
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: nightly
        prerelease: true
        make_latest: false
        overwrite_files: true
        fail_on_unmatched_files: true
        files: |
          artefacts/biorand.zip
          artefacts/biorand-cli-win-x64.zip
          artefacts/biorand-cli-linux-x64.tar.gz
